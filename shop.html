<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop · DAR Building Materials Shop</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="s-head">
    <div class="s-head-in">
      <a class="s-logo" id="home" href="/" aria-label="DAR Building Materials Shop">
        <svg viewBox="0 0 34 56" aria-hidden="true"><circle cx="8" cy="10" r="6" fill="none" stroke="#ff5a1f" stroke-width="3"/><rect x="22" y="0" width="4.5" height="56" fill="#ff5a1f"/></svg>
        <span><b>DAR</b><small>Building Materials <em>Shop</em></small></span>
      </a>
      <div class="s-navslot" id="navSlot"></div>
      <label class="s-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off" /></label>
      <nav class="s-langs" aria-label="Language"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="ar">ع</button></nav>
      <button class="s-cart" id="cartBtn" aria-label="Order"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span id="cartCount">0</span></button>
    </div>
  </header>

  <section class="s-hero" id="hero">
    <div class="s-hero-in">
      <div class="s-hero-text" id="heroText"></div>
      <div class="s-c3d" id="c3d"><div class="s-c3d-ui" id="c3dui"></div></div>
    </div>
  </section>

  <section class="s-catrow" id="catrow" aria-label="Categories"></section>

  <main class="s-main">
    <aside class="s-side" id="side"></aside>
    <div class="s-body">
      <div class="s-tools" id="tools"></div>
      <ul class="s-grid" id="grid"></ul>
    </div>
  </main>

  <footer class="s-foot" id="foot"></footer>

  <div class="s-dim" id="dim"></div>
  <aside class="s-drawer" id="drawer" aria-modal="true" role="dialog"></aside>
  <div class="s-modal" id="modal" aria-modal="true" role="dialog"></div>

  <script type="module" src="/src/shop.js"></script>
</body>
</html>
