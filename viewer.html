<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D model check</title>
<style>html,body{margin:0;height:100%;background:#e6e7e9;font:14px Arial}#c{width:100%;height:100%;display:block}#l{position:fixed;top:10px;left:10px}</style>
</head><body><div id="l"></div><canvas id="c"></canvas>
<script type="module">
// QA page: /viewer.html?m=drill&a=40  (a = fixed turn in degrees; omit to auto-rotate)
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
import { patchLabels, DRILL_PATCHES } from '/src/tools.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search), name = q.get('m') || 'drill';
document.getElementById('l').textContent = name;
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true }); r.setPixelRatio(devicePixelRatio);
r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); s.background = new THREE.Color(0xe6e7e9);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 5, 4); s.add(sun);
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 50); cam.position.set(0, 0.1, 3.2);
let obj;
// ?src=hf loads the Higgsfield version from /products/total/3d-hf/
new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('/draco/')).load(`/products/total/${q.get('src') === 'hf' ? '3d-hf' : '3d'}/${name}.glb`, g => {
  obj = new THREE.Group(); const m = g.scene;
  if (q.get('src') === 'hf' && name === 'drill' && !q.has('raw')) patchLabels(m, DRILL_PATCHES);
  const b = new THREE.Box3().setFromObject(m), sz = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const k = 1 / Math.max(sz.x, sz.y, sz.z); m.scale.setScalar(k); m.position.copy(c).multiplyScalar(-k);
  obj.add(m); s.add(obj);
  window.V = { THREE, root: m, cam, obj }; // QA: lets the browser console probe the model
});
function fit() { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();
const t0 = performance.now();
(function loop() {
  if (obj) obj.rotation.y = q.has('a') ? THREE.MathUtils.degToRad(+q.get('a')) : Math.sin((performance.now() - t0) / 1500) * 1.0;
  r.render(s, cam); requestAnimationFrame(loop);
})();
</script></body></html>
